<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Search</title>
  <desc id="desc">Magnifying glass</desc>

  <defs>
    <linearGradient
      id="search-gradient"
      x1="0.15"
      y1="0.1"
      x2="0.85"
      y2="0.9"
    >
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#d8d8e6" />
      <stop offset="1" stop-color="#a7a7b8" />
    </linearGradient>

    <filter
      id="search-shadow"
      x="-20%"
      y="-20%"
      width="150%"
      height="150%"
    >
      <feDropShadow
        dx="1"
        dy="2"
        stdDeviation="1.5"
        flood-color="#160027"
        flood-opacity="0.45"
      />
    </filter>
  </defs>

  <g filter="url(#search-shadow)">
    <circle
      cx="27"
      cy="27"
      r="13"
      fill="none"
      stroke="url(#search-gradient)"
      stroke-width="3.4"
    />

    <path
      d="M37 37 L50 50"
      fill="none"
      stroke="url(#search-gradient)"
      stroke-width="4"
      stroke-linecap="round"
    />

    <path
      d="M19 19
         C21 17 24 16 27 16"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.65"
      stroke-width="2"
      stroke-linecap="round"
    />

    <circle
      cx="22"
      cy="21"
      r="1.4"
      fill="#ffffff"
      fill-opacity="0.7"
    />
  </g>
</svg>
