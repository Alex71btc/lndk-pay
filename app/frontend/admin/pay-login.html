<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BOLT12 Pay Login</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <style>
    html {
      min-height: 100%;
      background: #0b1220;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: grid;
      place-items: center;
      place-items: safe center;
      background: #0b1220;
      color: #eef2ff;
      font-family: system-ui, sans-serif;
      padding: 16px;
      overflow-x: hidden;
    }
    .card {
      width: min(420px, 100%);
      max-width: 100%;
      background: #111827;
      border: 1px solid #26324a;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #eef2ff;
      margin-top: 8px;
      margin-bottom: 14px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #f59e0b;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled {
      opacity: .7;
      cursor: wait;
    }
    /* Blink/Chrome detects autofill even when no input/change event fires. */
    @keyframes bolt12PasswordAutofill {
      from { opacity: 1; }
      to { opacity: 1; }
    }
    input:-webkit-autofill,
    input:autofill {
      animation: bolt12PasswordAutofill 0.01s linear;
    }
    .muted { opacity: .82; font-size: .95rem; margin-bottom: 16px; }
    .error { color: #fca5a5; min-height: 24px; margin-top: 12px; white-space: pre-wrap; }
    @media (max-height: 520px) {
      body {
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
      <img src="/assets/icon.png" alt="Logo" style="width:48px;height:48px;border-radius:12px;">
      <div>
        <div style="font-size:1.25rem;font-weight:800;">⚡ BOLT12 Pay</div>
        <div class="muted">Protected Pay Area</div>
      </div>
    </div>

    <form id="loginForm" action="/api/auth/login" method="post" novalidate>
      <label for="password" id="passwordLabel">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        enterkeyhint="go"
        placeholder="Enter password"
        aria-describedby="msg"
        required
      />

      <button id="loginBtn" type="submit">Login</button>
      <div id="msg" class="error" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const passwordEl = document.getElementById("password");
    const msgEl = document.getElementById("msg");
    let loginInProgress = false;
    let loginLockInterval = null;

    const LOGIN_TEXT = {
      de: {
        passwordLabel: "Passwort",
        passwordPlaceholder: "Passwort eingeben",
        login: "Login",
        loggingIn: "Login...",
        emptyPassword: "Bitte Passwort eingeben.",
        invalidPassword: "Ungültiges Passwort",
        requestFailed: "Login-Anfrage fehlgeschlagen",
        tooManyAttempts: (seconds) =>
          `Zu viele Versuche. Bitte in ${seconds}s erneut versuchen.`,
        wait: (seconds) => `Warte ${seconds}s`
      },
      en: {
        passwordLabel: "Password",
        passwordPlaceholder: "Enter password",
        login: "Login",
        loggingIn: "Login...",
        emptyPassword: "Please enter a password.",
        invalidPassword: "Invalid password",
        requestFailed: "Login request failed",
        tooManyAttempts: (seconds) =>
          `Too many attempts. Try again in ${seconds}s`,
        wait: (seconds) => `Wait ${seconds}s`
      }
    };

    function getLoginLanguage() {
      const stored = localStorage.getItem("app_lang");
      if (stored === "de" || stored === "en") return stored;
      const browserLanguage = navigator.language || navigator.userLanguage || "en";
      return browserLanguage.toLowerCase().startsWith("de") ? "de" : "en";
    }

    function loginText(key, ...args) {
      const value = LOGIN_TEXT[getLoginLanguage()][key];
      return typeof value === "function" ? value(...args) : value;
    }

    function applyLoginI18n() {
      document.documentElement.lang = getLoginLanguage();
      document.getElementById("passwordLabel").textContent =
        loginText("passwordLabel");
      passwordEl.placeholder = loginText("passwordPlaceholder");
      loginBtn.textContent = loginText("login");
    }

    function normalizeLoginError(data) {
      const message = typeof data?.detail === "string"
        ? data.detail
        : (typeof data?.error === "string" ? data.error : "");

      if (!message || message === "Invalid password" || message === "Ungültiges Passwort") {
        return loginText("invalidPassword");
      }
      return message;
    }

    function restoreLoginButton() {
      loginBtn.disabled = false;
      loginBtn.textContent = loginText("login");
    }

    function startLoginLockout(seconds) {
      if (loginLockInterval !== null) {
        clearInterval(loginLockInterval);
      }

      let remaining = Math.max(1, seconds);
      const render = () => {
        msgEl.textContent = loginText("tooManyAttempts", remaining);
        loginBtn.textContent = loginText("wait", remaining);
      };

      loginBtn.disabled = true;
      render();
      loginLockInterval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(loginLockInterval);
          loginLockInterval = null;
          msgEl.textContent = "";
          restoreLoginButton();
          passwordEl.focus();
          return;
        }
        render();
      }, 1000);
    }

    function getSafeNextPath() {
      const requested = new URLSearchParams(window.location.search).get("next");
      if (!requested || !requested.startsWith("/") || requested.startsWith("//")) {
        return "/pay";
      }

      try {
        const target = new URL(requested, window.location.origin);
        if (target.origin !== window.location.origin) return "/pay";
        return `${target.pathname}${target.search}${target.hash}`;
      } catch {
        return "/pay";
      }
    }

    async function doLogin() {
      if (loginInProgress || loginBtn.disabled) return;

      const password = passwordEl.value || "";
      if (!password) {
        msgEl.textContent = loginText("emptyPassword");
        passwordEl.focus();
        return;
      }

      loginInProgress = true;
      msgEl.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = loginText("loggingIn");
      let restoreButton = true;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          cache: "no-store",
          body: JSON.stringify({ password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          if (res.status === 429) {
            const remaining = Number.parseInt(
              data.retry_after || res.headers.get("Retry-After") || "0",
              10
            );
            if (remaining > 0) {
              restoreButton = false;
              startLoginLockout(remaining);
              return;
            }
          }

          msgEl.textContent = normalizeLoginError(data);
          passwordEl.select();
          return;
        }

        restoreButton = false;
        window.location.assign(getSafeNextPath());
      } catch (err) {
        msgEl.textContent = loginText("requestFailed");
        passwordEl.select();
      } finally {
        loginInProgress = false;
        if (restoreButton && loginLockInterval === null) {
          restoreLoginButton();
        }
      }
    }

    // Android Chrome's password manager fills the field but does not submit
    // the form when the user confirms the credential picker. Best effort:
    // react only to a browser-autofilled value following an explicit field
    // interaction or a credential-picker-like focus handoff. Do NOT submit
    // on page-load autofill or while someone is manually typing a password.
    let credentialSelectionArmed = false;
    let autofillLoginRequested = false;
    let autofillLoginTimer = null;

    function passwordIsBrowserAutofilled() {
      for (const selector of [":autofill", ":-webkit-autofill"]) {
        try {
          if (passwordEl.matches(selector)) return true;
        } catch {
          // The selector may not exist in this browser.
        }
      }
      return false;
    }

    function schedulePasswordManagerLogin() {
      if (!credentialSelectionArmed || autofillLoginRequested ||
          loginInProgress || loginBtn.disabled || !passwordEl.value) return;

      if (autofillLoginTimer !== null) clearTimeout(autofillLoginTimer);
      autofillLoginTimer = setTimeout(() => {
        autofillLoginTimer = null;
        if (!credentialSelectionArmed || autofillLoginRequested ||
            loginInProgress || loginBtn.disabled || !passwordEl.value ||
            !passwordIsBrowserAutofilled()) return;

        // Always use the existing validation, fetch and single-flight guard.
        autofillLoginRequested = true;
        loginForm.requestSubmit();
      }, 180);
    }

    function armPasswordManagerSelection() {
      credentialSelectionArmed = true;
      autofillLoginRequested = false;
    }

    // A tap on the password field usually precedes selecting a saved login.
    // Keyboard typing alone never arms an automatic submission.
    passwordEl.addEventListener("pointerdown", armPasswordManagerSelection, { passive: true });

    // Some Android credential sheets take focus away from the browser.
    // Cover that path even if the user did not first tap the password field.
    window.addEventListener("blur", () => {
      if (document.activeElement === passwordEl && !passwordEl.value) {
        armPasswordManagerSelection();
      }
    });
    window.addEventListener("focus", schedulePasswordManagerLogin);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) schedulePasswordManagerLogin();
    });

    // Browser versions and password managers emit different notifications.
    for (const eventName of ["input", "change"]) {
      passwordEl.addEventListener(eventName, schedulePasswordManagerLogin);
    }
    passwordEl.addEventListener("animationstart", (event) => {
      if (event.animationName === "bolt12PasswordAutofill") {
        schedulePasswordManagerLogin();
      }
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (autofillLoginTimer !== null) {
        clearTimeout(autofillLoginTimer);
        autofillLoginTimer = null;
      }
      void doLogin();
    });

    applyLoginI18n();
    passwordEl.focus();
  </script>

</body>
</html>
