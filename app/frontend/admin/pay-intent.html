  <body>
    <main>
      <h1>BOLT12 Pay</h1>
      <p id="status" data-i18n="intent.opening">Opening the payment form…</p>
      <p><a href="/pay" data-i18n="intent.openForm">Open payment form</a></p>
    </main>
    <script>
      (() => {
        "use strict";

        const STORAGE_KEY = "bolt12pay.incoming-lightning";
        const MAX_TARGET_LENGTH = 8192;

        function showIntentStatus(key) {
          const status = document.getElementById("status");
          status.dataset.i18n = key;
          status.textContent = window.__t(key);
        }

        window.applyTranslations();

        function isLightningAddress(value) {
          if (value.length > 320) return false;

          const separator = value.indexOf("@");
          if (separator <= 0 || separator !== value.lastIndexOf("@")) {
            return false;
          }

          const local = value.slice(0, separator);
          const domain = value.slice(separator + 1);
          if (
            local.length > 64 ||
            local.startsWith(".") ||
            local.endsWith(".") ||
            local.includes("..") ||
            !/^[a-zA-Z0-9_+.-]+$/.test(local)
          ) {
            return false;
          }

          if (
            !domain ||
            domain.length > 253 ||
            domain.startsWith(".") ||
            domain.endsWith(".") ||
            domain.includes("..")
          ) {
            return false;
          }

          const labels = domain.split(".");
          return (
            labels.length >= 2 &&
            labels.every((label) =>
              /^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$/.test(
                label,
              ),
            )
          );
        }

        function normalizeLightningTarget(raw) {
          let value = String(raw || "").trim();
          value = value.replace(/^lightning:\/\/?/i, "");
          if (!value || value.length > MAX_TARGET_LENGTH) return "";
          if (isLightningAddress(value)) return value;
          if (!/^[a-zA-Z0-9]+$/.test(value)) return "";

          const lower = value.toLowerCase();
          const isBolt12 = lower.startsWith("lno1");
          const isBolt11 = /^(lnbc|lntb|lnbcrt)\d*[munp]?1/.test(lower);
          return isBolt12 || isBolt11 ? value : "";
        }

        const params = new URLSearchParams(window.location.hash.slice(1));
        const target = normalizeLightningTarget(params.get("lightning"));
        history.replaceState(null, "", window.location.pathname);

        try {
          sessionStorage.removeItem(STORAGE_KEY);
        } catch {}

        if (!target) {
          showIntentStatus("intent.invalid");
          return;
        }

        try {
          sessionStorage.setItem(STORAGE_KEY, target);
          window.location.replace("/pay");
        } catch {
          showIntentStatus("intent.handoffFailed");
        }
      })();
    </script>
