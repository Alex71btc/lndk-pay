version: "3.8"

services:
  lndk:
    image: alex71btc/lndk:bolt12-pay-295b537-multiarch@sha256:9d43c21a07892432602dfd369ba51391899519e4a2b07e41116b96ce766a07a1
    container_name: lndk
    restart: unless-stopped

    command: >
      lndk
      --address=https://YOUR_NODE_IP:10009
      --cert-path=/secrets/tls.cert
      --macaroon-path=/secrets/admin.macaroon
      --data-dir=/data
      --grpc-host=0.0.0.0
      --grpc-port=7000

    volumes:
      - lndk_data:/data
      - /root/lndk-secrets:/secrets:ro

    ports:
      - "7000:7000"

volumes:
  lndk_data:
