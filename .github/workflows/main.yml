name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.21.0
  RUST_TOOLCHAIN: 1.88.0

jobs:
  changes:
    name: Detect LNDK changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      lndk: ${{ steps.diff.outputs.lndk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "lndk=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base=$BASE_SHA
          fi
          if git diff --quiet "$base" "$HEAD_SHA" -- 'src/**' ':(glob)tests/**/*.rs' 'tests/common/**' 'tonic_lnd/**' 'proto/**' 'lnd' 'Cargo.toml' 'Cargo.lock' 'build.rs' 'rust-toolchain.toml' 'justfile' '.cargo/**' '.gitmodules' 'scripts/wait-for-lnd.sh' 'Dockerfile' 'config_spec.toml' 'nix/**' 'flake.nix' 'flake.lock' '.github/workflows/main.yml'; then
            echo "lndk=false" >> "$GITHUB_OUTPUT"
          else
            echo "lndk=true" >> "$GITHUB_OUTPUT"
          fi

  python-app-tests:
    name: BOLT12 Pay Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: app
      - name: Install UI text checker
        run: npm ci --prefix scripts/ui-text-lint
      - name: Validate translation catalogs and generated assets
        run: python scripts/build_i18n.py --check
      - name: Reject untranslated UI text and unknown keys
        run: python scripts/check_ui_text.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
        working-directory: app
      - run: python -m unittest discover -s tests -p 'test_*.py'

  build_and_format:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.lndk == 'true') }}
    name: LNDK Rust Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: sudo apt-get install protobuf-compiler
      - run: cargo build --release --all-features
      - run: cargo fmt -- --config unstable_features=true --config wrap_comments=true --config comment_width=100 --check
      - run: cargo clippy -- --deny warnings

  ########################
  # run ubuntu integration tests
  ########################
  ubuntu-integration-test:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.lndk == 'true') }}
    name: run ubuntu unit and integration tests
    runs-on: ubuntu-latest
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: sudo apt-get install protobuf-compiler
      - name: setup go ${{ env.GO_VERSION }}
        uses: lightningnetwork/lnd/.github/actions/setup-go@v0-16-4-branch
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Install just
        run: |
          if ! command -v just &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin
          else
            echo "just is already installed: $(just --version)"
          fi
      - name: run unit tests
        run: just lib-test
      - name: run cli unit tests
        run: just cli-test
      - name: run integration tests
        run: just itest

  coverage:
    if: github.event_name == 'workflow_dispatch'
    name: LNDK Code Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: sudo apt-get install protobuf-compiler
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --bin lndk --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  check-flake:
    if: github.event_name == 'workflow_dispatch'
    name: Check Nix Flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v8

      - name: Install Nix
        uses: cachix/install-nix-action@v31.7.0
        with:
          nix_path: nixpkgs=channel:nixos-24.05
      - name: Check flake
        run: nix flake check
